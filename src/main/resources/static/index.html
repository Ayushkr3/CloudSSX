<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudSSX</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <section id="auth-panel" class="card">
      <h1>CloudSSX</h1>
      <p>Sign in to manage virtual machines.</p>
      <form id="auth-form">
        <input id="username" placeholder="Username" autocomplete="username" required>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
        <button id="sign-up" type="button">Create account</button>
      </form>
      <p id="auth-error" class="error"></p>
    </section>
    <section id="dashboard" hidden>
      <header><h1>CloudSSX</h1><button id="sign-out">Sign out</button></header>
      <form id="create-form" class="card"><input id="vm-name" placeholder="VM name" required><button>Create VM</button></form>
      <p id="vm-error" class="error"></p>
      <div id="vm-list"></div>
      <section id="viewer" class="card" hidden>
        <header><h2 id="viewer-name"></h2><button id="close-viewer">Close</button></header>
        <video id="stream" autoplay playsinline muted></video>
        <p>Click the video to send mouse and keyboard input to this VM.</p>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
